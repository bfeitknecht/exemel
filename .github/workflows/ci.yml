name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typst ${{ matrix.typst }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (`compiler` in typst.toml) and the latest release.
        typst: ["0.15.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run tests
        run: just test
      - name: Compile the README examples
        run: just readme
      - name: Check that the reference files are up to date
        run: just check-refs
      - name: Check the documented typst eval workflow
        run: typst eval --root . --in tests/atom.typ 'query(<out>).first().value' | jq -j . | cmp - tests/ref/atom.xml
      - name: Build the manual
        run: just manual

  lint:
    name: Format and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just,typos
      - name: Install typstyle
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/typstyle" \
            https://github.com/typstyle-rs/typstyle/releases/download/v0.15.1/typstyle-x86_64-unknown-linux-gnu
          chmod +x "$HOME/.local/bin/typstyle"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: just fmt-check
      - name: Check spelling
        run: just spell
