name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Typst ${{ matrix.typst }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (`compiler` in typst.toml) and the latest release.
        typst: ["0.15.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - name: Run tests
        run: tests/run.sh
      - name: Check that reference files are up to date (via bundle export)
        run: |
          tests/update-refs.sh
          git diff --exit-code tests/ref
      - name: Check the documented typst eval workflow
        run: |
          typst eval --root . --in tests/atom.typ 'query(<out>).first().value' | jq -j . | cmp - tests/ref/atom.xml
