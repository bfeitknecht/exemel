name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Typst ${{ matrix.typst }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (`compiler` in typst.toml) and the latest release.
        typst: ["0.15.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - name: Run tests
        run: tests/run.sh
      - name: Check that reference files are up to date
        run: |
          tests/update-refs.sh
          git diff --exit-code tests/ref
      - name: Check bundle export
        run: |
          out="$RUNNER_TEMP/site"
          typst compile --root . --features bundle --format bundle tests/bundle/site.typ "$out"
          cmp "$out/feed.xml" tests/ref/atom.xml
          cmp "$out/rss.xml" tests/ref/rss.xml
          cmp "$out/sitemap.xml" tests/ref/sitemap.xml
