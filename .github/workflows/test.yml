name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Typst ${{ matrix.typst }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (see `compiler` in typst.toml) through latest.
        typst: ["0.13", "0.14", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst }}
      - run: tests/run.sh
